[project]
name = "a-ka-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchaudio",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "fastapi-pagination>=0.15.12",
    "fastapi[standard]>=0.135.3",
    "ffmpeg>=1.4",
    "ffprobe>=0.5",
    "greenlet>=3.4.0",
    "isodate>=0.7.2",
    "langgraph>=1.1.9",
    "langsmith>=0.3.0",
    "openai>=2.31.0",
    "openai-whisper>=20250625",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.3.17",
    "langchain-openai>=1.2.1",
    "langchain-google-genai>=4.2.2",
    "langchain-anthropic>=1.4.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.ruff]
exclude = [
    "test_*.py",     # 파일 이름이 test_로 시작하는 모든 .py 파일 제외
    "**/test_*.py",  # 하위 폴더(알수없는 깊이)에 있는 test_*.py 파일까지 모두 제외
]

[tool.ruff.lint]
ignore = [
    "TRY002",
    "BLE001",
]