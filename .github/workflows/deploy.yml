name: CI then Deploy to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # --- CI: 서로 독립적인 두 개 job이라 병렬로 실행됨 ---
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (lint)
        run: ruff check .

  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  # --- CD: main에 push됐을 때만, 위 두 job이 모두 성공해야 실행됨 ---
  deploy:
    needs: [lint-python, lint-dockerfile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_APP_DIR }}
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build web db redis
            docker compose -f docker-compose.prod.yml exec -T db psql -U zo_o -d aka_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
            docker compose -f docker-compose.prod.yml exec -T web uv run python -c "from database import Base, engine; import app.models; Base.metadata.create_all(bind=engine); print('tables created')"
            docker compose -f docker-compose.prod.yml restart web